<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dev's Hub">
  <defs>
    <radialGradient id="s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="p" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="7" fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="0.5"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="rgba(139,92,246,0.18)" stroke-width="0.4"/>
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="rgba(124,58,237,0.12)" stroke-width="0.35"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="16" cy="9" r="1.55" fill="url(#p)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="60 16 16" to="420 16 16" dur="4s" repeatCount="indefinite"/>
    <circle cx="16" cy="5.5" r="1.15" fill="#a78bfa"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 16 16" to="-180 16 16" dur="3.4s" repeatCount="indefinite"/>
    <circle cx="16" cy="5.5" r="0.9" fill="#c4b5fd"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="90 16 16" to="450 16 16" dur="6s" repeatCount="indefinite"/>
    <circle cx="16" cy="2.5" r="0.75" fill="#8b5cf6"/>
  </g>
  <circle cx="16" cy="16" r="3.1" fill="url(#s)"/>
  <circle cx="16" cy="16" r="1.45" fill="#ffffff"/>
</svg>
