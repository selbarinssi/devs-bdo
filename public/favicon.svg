<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dev's Hub">
  <defs>
    <radialGradient id="s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="p" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#04060c"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="0.5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="6s" repeatCount="indefinite"/>
    <circle cx="16" cy="8.5" r="1.7" fill="url(#p)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 16 16" to="480 16 16" dur="10s" repeatCount="indefinite"/>
    <circle cx="16" cy="5" r="1.2" fill="#a78bfa"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="url(#s)"/>
  <circle cx="16" cy="16" r="1.6" fill="#ffffff"/>
</svg>
